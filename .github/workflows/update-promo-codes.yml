name: Update Pokémon GO promo codes

on:
  schedule:
    - cron: '23 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-promo-codes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run scrape:codes
      - name: Commit only changed promo data
        run: |
          if git diff --quiet -- src/data/promo-codes.json; then
            echo "Promo codes unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/promo-codes.json
          git commit -m "Update Pokémon GO promo codes"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
